# Android build / QA / optional signed rolling release
name: android

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.gradle_check.outputs.exists }}
      release_exists: ${{ steps.release_check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Gradle project
        id: gradle_check
        run: |
          if [ -f gradlew ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No gradlew yet — skipping Android build."
          fi

      - name: Set up JDK 17
        if: steps.gradle_check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.gradle_check.outputs.exists == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK + unit tests
        if: steps.gradle_check.outputs.exists == 'true'
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Build privately signed release APK + Play bundle when configured
        if: steps.gradle_check.outputs.exists == 'true'
        env:
          AKARI_KEYSTORE_B64: ${{ secrets.AKARI_KEYSTORE_BASE64 }}
          AKARI_KEYSTORE_PASSWORD: ${{ secrets.AKARI_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$AKARI_KEYSTORE_B64" ] || [ -z "$AKARI_KEYSTORE_PASSWORD" ]; then
            echo "Private release signing is not configured — verification continues, publication will be skipped."
            exit 0
          fi
          printf '%s' "$AKARI_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/akari.jks"
          chmod 600 "$RUNNER_TEMP/akari.jks"
          AKARI_KEYSTORE="$RUNNER_TEMP/akari.jks" ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Detect signed release artifacts
        if: steps.gradle_check.outputs.exists == 'true'
        id: release_check
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Signed release artifact exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No signed release artifact — rolling release will not publish."
          fi

      - name: Upload debug APK verification artifact
        if: steps.gradle_check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: akari-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK artifact
        if: steps.release_check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: akari-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Play bundle artifact
        if: steps.release_check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: akari-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # Boots the app on an emulator, walks the instrumented smoke path, and uploads
  # screenshots — useful evidence the app actually launches, not just compiles.
  smoke:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest -Pandroid.enableAdditionalTestOutput=true --no-daemon

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akari-screenshots
          path: app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn

      - name: Upload instrumented-test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-report
          path: app/build/reports/androidTests/
          if-no-files-found: warn

  # Publication is impossible unless the build job proved that a private signed
  # release APK exists. Ordinary CI stays green when release signing is absent.
  release:
    runs-on: ubuntu-latest
    needs: [build, smoke]
    if: >-
      needs.build.outputs.exists == 'true' &&
      needs.build.outputs.release_exists == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download signed release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: akari-release-apk
          path: release

      - name: Download debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: akari-debug-apk
          path: debug

      - name: Download Play bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: akari-release-aab
          path: bundle

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=latest
          mv release/app-release.apk akari.apk
          mv debug/app-debug.apk akari-demo.apk
          mv bundle/app-release.aab akari.aab
          NOTES="Built from \`${GITHUB_SHA}\`.

          \`akari.apk\` is the privately signed application build.
          \`akari-demo.apk\` is the CI debug/design-review build and is not the trusted distribution identity.
          \`akari.aab\` is the signed Play bundle artifact."
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "Akari (latest main)" --notes "$NOTES"
          gh release upload "$TAG" akari.apk akari-demo.apk akari.aab --clobber
          gh release edit "$TAG" --title "Akari (latest main)" --notes "$NOTES"
